      const lw = flakeLight * Math.exp(-(((cx - sc.fx) / sc.lsx) ** 2) - (((cy - sc.lfy) / sc.lsy) ** 2));
      if (lw > 0.03) { col[0] = Math.min(255, col[0] * (1 + 0.1 * lw) + 40 * lw); col[1] = col[1] * (1 - 0.35 * lw) + 10 * lw; col[2] = col[2] * (1 - 0.8 * lw); }
    }
    setc(c, fl.g[i], col, z, K_SNOW);
  }

  for (const p of sc.puffs) {
    const a = ((t - p.t) % T + T) % T;
    if (a > p.life) continue;
    const x = p.x + 0.6 * p.vx * a + 0.2 * S.wind * a * a, y = p.y + 0.6 * p.vy * a + 1.9 * a * a;
    const cx = Math.round(x), cy = Math.round(y);
    if (cx < 0 || cy < 0 || cx >= W || cy >= H - 1) continue;
    const c = cy * W + cx, q = a / p.life;
    if (D[c] > p.depth + 0.01) continue;
    setc(c, GI(q < 0.3 ? '*' : q < 0.65 ? 'o' : q < 0.85 ? '.' : "'"), sc3(P.snowNear, 1 - 0.45 * q), p.depth, K_PUFF);
  }

  // smoke
  const fTop = sc.fireBottom - Math.round(sc.fireH) - 1;
  for (const p of sc.smoke) {
    const a = ((t - p.t) % T + T) % T;
    if (a > p.life) continue;
    const q = a / p.life;
    const y = fTop + p.y - p.vy * 7.5 * (1 - Math.exp(-a / 7.5));
    const x = sc.fx + p.x + p.vx * S.wind * gust(t, T) * a * 0.9 + 0.8 * Math.sin(a * 0.8 + p.sw);
    const cx = Math.round(x), cy = Math.round(y);
    if (cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
    const c = cy * W + cx;
    if (D[c] > 0.6) continue;
    const ch = q < 0.22 ? (p.big < 0.5 ? '0' : 'O') : q < 0.5 ? (p.big < 0.6 ? '0' : 'o') : q < 0.75 ? (p.big < 0.5 ? 'o' : ',') : (p.big < 0.5 ? '.' : ',');
    setc(c, GI(ch), mix3(P.smoke, P.smokeDim, q * q * q), 0.6, K_SMOKE);
  }

  // fire
  for (let y = 0; y < sc.Fh; y++) {
    for (let x = 0; x < sc.Fw; x++) {
      const h = hs[y * sc.Fw + x];
      if (h < FIRE[0][0]) continue;
      let k = 0;
      while (k + 1 < FIRE.length && h >= FIRE[k + 1][0]) k++;
      const gx = sc.fx0 + x, gy = sc.fireBottom - sc.Fh + 1 + y;
      if (gx < 0 || gx >= W || gy < 0 || gy >= H) continue;
      setc(gy * W + gx, GI(FIRE[k][1]), fireCol(h), 0.7, K_FIRE);
    }
  }

  // sparks
  for (const p of sc.sparks) {
    const a = ((t - p.t) % T + T) % T;
    if (a > p.life) continue;
    const q = a / p.life;
    const x = sc.fx + p.x + 0.25 * S.wind * a + p.sw * Math.sin(TAU * p.fs * a + p.sp);
    const y = sc.fireBottom - p.y * sc.fireH - p.vy * a;
    const cx = Math.round(x), cy = Math.round(y);
    if (cx < 0 || cy < 0 || cx >= W || cy >= H - 1) continue;
    const c = cy * W + cx;
    if (KD[c] === K_FIRE) continue;
    setc(c, GI(q < 0.25 ? '*' : q < 0.6 ? "'" : '.'), EMBER[Math.min(EMBER.length - 1, Math.floor(q * EMBER.length))], 0.95, K_EMBER);
  }

  // fireflies
  const nFlies = Math.min(sc.flies.length, Math.round(S.flies * W * H / 420));
  for (let n = 0; n < nFlies; n++) {
    const f = sc.flies[n];
    const blink = Math.sin(TAU * f.kb * t / T + f.pb);
    if (blink < 1 - 2 * f.duty) continue;
    const x = f.x + f.ax * Math.sin(TAU * f.k1 * t / T + f.p1) + f.bx * Math.sin(TAU * f.k2 * t / T + f.p2);
    const y = f.y + f.ay * Math.sin(TAU * f.k3 * t / T + f.p3) + f.by * Math.sin(TAU * f.k4 * t / T + f.p4);
    const cx = ((Math.round(x) % W) + W) % W, cy = Math.round(y);
    if (cy < 0 || cy >= H - 1) continue;
    const c = cy * W + cx;
    const lit = clamp((blink - (1 - 2 * f.duty)) * 3, 0.35, 1);
    setc(c, GI(lit > 0.5 ? '+' : '.'), sc3(f.col, 0.55 + 0.45 * lit), 0.9, K_FLY);
  }

  // status bar and help
  if (S.bar) drawText(0, H - 1, statusText(), P.status);
  if (showHelp) drawHelp();
}

function statusText() {
  return ' WINTER NIGHT | speed ' + S.speed.toFixed(2) + ' | wind ' + S.wind.toFixed(1) + ' | snow ' + S.snow.toFixed(1) +
    ' | fire ' + S.fire.toFixed(1) + ' | flies ' + S.flies.toFixed(1) + ' | glow ' + (S.glow ? 'on' : 'off') +
    ' | moon ' + (S.moon ? 'on' : 'off') + ' | ' + (CAPTURE || !fpsShown ? S.fps : fpsShown) + ' fps | [H]elp';
}
function drawText(x, y, s, col) {
  for (let k = 0; k < s.length && x + k < W; k++) {
    if (x + k < 0 || y < 0 || y >= H) continue;
    const i = y * W + x + k;
    G[i] = GI(s[k]); C[i * 4] = col[0]; C[i * 4 + 1] = col[1]; C[i * 4 + 2] = col[2]; D[i] = 2; KD[i] = K_TEXT;
  }
}
function drawHelp() {
  const lines = [
    'WINTER NIGHT  -  keys',
    '',
    'H        show or hide this help',
    '[  ]     slower / faster',
    'w  W     less / more wind',
    's  S     less / more snow',
    'f  F     smaller / bigger fire',
    'l  L     fewer / more fireflies',
    'G        glow on / off',
    'M        moon on / off',
    'B        status line on / off',
  ];
  const w = Math.max(...lines.map(l => l.length)) + 4, h = lines.length + 2;
  const x0 = Math.floor((W - w) / 2), y0 = Math.floor((H - h) / 2);
  for (let y = 0; y < h; y++) {
    let row;
    if (y === 0 || y === h - 1) row = '+' + '-'.repeat(w - 2) + '+';
    else row = '| ' + lines[y - 1].padEnd(w - 4) + ' |';
    drawText(x0, y0 + y, row, P.help);
  }
}

// glow
let glowBuf, glowTmp, glowOut;
function computeGlow() {
  const gain = GLOW_GAIN;
  for (let i = 0; i < N; i++) {
    const g = G[i];
    const k = g ? gain[KD[i]] * ink[g] : 0;
    const j = i * 3;
    glowBuf[j] = C[i * 4] * k; glowBuf[j + 1] = C[i * 4 + 1] * k; glowBuf[j + 2] = C[i * 4 + 2] * k;
  }
  // cells are half as wide as tall, so blur wider in x
  const kx = [0.06, 0.13, 0.19, 0.24, 0.19, 0.13, 0.06], ky = [0.17, 0.66, 0.17].map(v => v);
  const sx = kx.length >> 1, sy = ky.length >> 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let r = 0, g = 0, b = 0;
    for (let k = -sx; k <= sx; k++) { const xx = x + k; if (xx < 0 || xx >= W) continue; const j = (y * W + xx) * 3, w = kx[k + sx]; r += glowBuf[j] * w; g += glowBuf[j + 1] * w; b += glowBuf[j + 2] * w; }
    const o = (y * W + x) * 3; glowTmp[o] = r; glowTmp[o + 1] = g; glowTmp[o + 2] = b;
  }
  const sc = scene;
  const fireA = S.fire / 1.7;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let r = 0, g = 0, b = 0;
    for (let k = -sy; k <= sy; k++) { const yy = y + k; if (yy < 0 || yy >= H) continue; const j = (yy * W + x) * 3, w = ky[k + sy]; r += glowTmp[j] * w; g += glowTmp[j + 1] * w; b += glowTmp[j + 2] * w; }
    const dfx = (x - sc.fx) / (H * 0.3), dfy = (y - (H - 8)) / (H * 0.17);
    const fh = Math.exp(-(dfx * dfx + dfy * dfy)) * 0.04 * fireA * (sc.breath || 1);
    r += 255 * fh; g += 120 * fh; b += 40 * fh;
    if (S.moon) {
      const dmx = (x - sc.moon.x) / (H * 0.12), dmy = (y - sc.moon.y) / (H * 0.06);
      const mh = Math.exp(-(dmx * dmx + dmy * dmy)) * 0.05;
      r += 230 * mh; g += 228 * mh; b += 220 * mh;
    }
    const o = (y * W + x) * 4;
    glowOut[o] = r / 255; glowOut[o + 1] = g / 255; glowOut[o + 2] = b / 255; glowOut[o + 3] = 1;
  }
}

// drawing
const canvas = document.getElementById('c');
let gl = null, prog = null, tex = {}, ctx2d = null;
let cellW = 8, cellH = 15, offX = 0, offY = 0, atlas = null;
const FONT_STACK = '"WNMono", "DejaVu Sans Mono", Menlo, Consolas, "Courier New", monospace';

function buildAtlas() {
  const cv = document.createElement('canvas');
  cv.width = cellW * 16; cv.height = cellH * 6;
  const x = cv.getContext('2d', { willReadFrequently: true });
  const wt = S.bold ? '700 ' : '400 ';
  x.font = wt + '100px ' + FONT_STACK;
  const m = x.measureText('M');
  const adv = m.width / 100;
  const asc = (m.fontBoundingBoxAscent || 92.8) / 100, desc = (m.fontBoundingBoxDescent || 23.6) / 100;
  const fs = cellW / adv;
  x.font = wt + fs + 'px ' + FONT_STACK;
  x.fillStyle = '#fff';
  x.textBaseline = 'alphabetic';
  const base = Math.round((cellH - (asc + desc) * fs) / 2 + asc * fs);
  // clip each glyph to its tile or descenders bleed into the row below
  for (let i = 1; i < 95; i++) {
    const ox = (i % 16) * cellW, oy = Math.floor(i / 16) * cellH;
    x.save(); x.beginPath(); x.rect(ox, oy, cellW, cellH); x.clip();
    x.fillText(String.fromCharCode(32 + i), ox, oy + base);
    x.restore();
  }
  const d = x.getImageData(0, 0, cv.width, cv.height).data;
  const AW = cv.width, AH = cv.height;
  const cov = new Float32Array(AW * AH);
  for (let i = 0; i < AW * AH; i++) cov[i] = d[i * 4 + 3] / 255;
  const sig = Math.max(0.8, cellW * 0.19), rad = Math.ceil(sig * 2.5);
  const kern = []; let ks = 0;
  for (let k = -rad; k <= rad; k++) { const v = Math.exp(-0.5 * (k / sig) ** 2); kern.push(v); ks += v; }
  for (let k = 0; k < kern.length; k++) kern[k] /= ks;
  const tmp = new Float32Array(AW * AH), blr = new Float32Array(AW * AH);
  for (let y = 0; y < AH; y++) for (let xx = 0; xx < AW; xx++) {
    const cx0 = Math.floor(xx / cellW) * cellW; let v = 0;
    for (let k = -rad; k <= rad; k++) { const sx = xx + k; if (sx < cx0 || sx >= cx0 + cellW) continue; v += cov[y * AW + sx] * kern[k + rad]; }
    tmp[y * AW + xx] = v;
  }
  for (let y = 0; y < AH; y++) for (let xx = 0; xx < AW; xx++) {
    const cy0 = Math.floor(y / cellH) * cellH; let v = 0;
    for (let k = -rad; k <= rad; k++) { const sy = y + k; if (sy < cy0 || sy >= cy0 + cellH) continue; v += tmp[sy * AW + xx] * kern[k + rad]; }
    blr[y * AW + xx] = v;
  }

  for (let i = 0; i < AW * AH; i++) { data[i * 4] = Math.round(cov[i] * 255); data[i * 4 + 1] = Math.min(255, Math.round(blr[i] * 255 * 1.6)); data[i * 4 + 3] = 255; }
  ink = new Float32Array(96);
  for (let i = 1; i < 95; i++) {
    const ox = (i % 16) * cellW, oy = Math.floor(i / 16) * cellH;
    let s = 0;
    for (let yy = 0; yy < cellH; yy++) for (let xx = 0; xx < cellW; xx++) s += d[((oy + yy) * cv.width + ox + xx) * 4 + 3];
    ink[i] = s / (255 * cellW * cellH);
  }
  // so busy glyphs like @ don't glow brighter
  let mx = 0; for (let i = 1; i < 95; i++) mx = Math.max(mx, ink[i]);
  for (let i = 1; i < 95; i++) ink[i] = Math.sqrt(ink[i] / mx);
  return { cv, fs, base, wt, data, AW, AH };
}

function initGL() {
  const g = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: CAPTURE, powerPreference: 'low-power' });
  if (!g) return null;
  const vs = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
  const fs = `#version 300 es
precision highp float; precision highp int;
uniform sampler2D uAtlas, uGlyph, uColor, uGlowT;
uniform vec2 uCell, uOff, uGrid; uniform float uH, uGlowAmt; uniform vec3 uBg, uBg2;
out vec4 o;
void main() {
  vec2 p = vec2(gl_FragCoord.x, uH - gl_FragCoord.y) - uOff;
  vec2 cell = floor(p / uCell);
  vec3 bg = mix(uBg, uBg2, smoothstep(0.55, 0.95, p.y / (uCell.y * uGrid.y)));
  vec3 col = bg;
  if (cell.x >= 0.0 && cell.y >= 0.0 && cell.x < uGrid.x && cell.y < uGrid.y) {
    ivec2 ci = ivec2(cell);
    float gi = floor(texelFetch(uGlyph, ci, 0).r * 255.0 + 0.5);
    vec3 fg = texelFetch(uColor, ci, 0).rgb;
    ivec2 lp = ivec2(p - cell * uCell);
    ivec2 a0 = ivec2(int(mod(gi, 16.0)), int(floor(gi / 16.0))) * ivec2(uCell);
    vec4 at = texelFetch(uAtlas, a0 + lp, 0);
    float lum = dot(fg, vec3(0.3, 0.55, 0.15));
    col = mix(bg, fg, at.r) + fg * at.g * (1.0 - at.r) * uGlowAmt * (0.12 + 0.46 * lum * lum);
    if (uGlowAmt > 0.0) col += texture(uGlowT, p / (uCell * uGrid)).rgb * uGlowAmt * 1.3 * (1.0 - 0.8 * at.r);
  }
  o = vec4(col, 1.0);
}`;
  const sh = (type, src) => { const s = g.createShader(type); g.shaderSource(s, src); g.compileShader(s); if (!g.getShaderParameter(s, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(s)); return s; };
  const pr = g.createProgram();
  g.attachShader(pr, sh(g.VERTEX_SHADER, vs)); g.attachShader(pr, sh(g.FRAGMENT_SHADER, fs));
  g.linkProgram(pr);
  if (!g.getProgramParameter(pr, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(pr));
  g.useProgram(pr);
  const buf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(pr, 'p');
  g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0);
  prog = pr;
  return g;
}
function mkTex(unit, filter) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function layout() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.max(1, Math.round(canvas.clientWidth * dpr)), ch = Math.max(1, Math.round(canvas.clientHeight * dpr));
  canvas.width = cw; canvas.height = ch;
  cellH = Math.max(6, Math.round(ch / S.rows));
  cellW = Math.max(3, Math.round(cellH * 8 / 15));
  W = Math.max(20, Math.floor(cw / cellW)); H = Math.max(12, Math.floor(ch / cellH));
  offX = Math.floor((cw - W * cellW) / 2); offY = Math.floor((ch - H * cellH) / 2);
  N = W * H;
  G = new Uint8Array(N); C = new Uint8Array(N * 4); D = new Float32Array(N); KD = new Uint8Array(N);
  for (let i = 0; i < N; i++) C[i * 4 + 3] = 255;
  glowBuf = new Float32Array(N * 3); glowTmp = new Float32Array(N * 3); glowOut = new Float32Array(N * 4);
  atlas = buildAtlas();
  windOffset = 0;
  buildScene();
  if (gl) {
    gl.viewport(0, 0, cw, ch);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    tex.atlas = tex.atlas || mkTex(0, gl.NEAREST);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex.atlas);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, atlas.AW, atlas.AH, 0, gl.RGBA, gl.UNSIGNED_BYTE, atlas.data);
    tex.glyph = tex.glyph || mkTex(1, gl.NEAREST);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex.glyph);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, W, H, 0, gl.RED, gl.UNSIGNED_BYTE, G);
    tex.color = tex.color || mkTex(2, gl.NEAREST);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tex.color);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, C);
    tex.glow = tex.glow || mkTex(3, gl.LINEAR);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, tex.glow);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.FLOAT, glowOut);
    const u = n => gl.getUniformLocation(prog, n);
    gl.uniform1i(u('uAtlas'), 0); gl.uniform1i(u('uGlyph'), 1); gl.uniform1i(u('uColor'), 2); gl.uniform1i(u('uGlowT'), 3);
    gl.uniform2f(u('uCell'), cellW, cellH); gl.uniform2f(u('uOff'), offX, offY); gl.uniform2f(u('uGrid'), W, H);
    gl.uniform1f(u('uH'), ch);
  }
}

function present() {
  if (S.glow) computeGlow();
  if (gl) {
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tex.glyph);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RED, gl.UNSIGNED_BYTE, G);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tex.color);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, C);
    if (S.glow) { gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, tex.glow); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RGBA, gl.FLOAT, glowOut); }
    gl.uniform1f(gl.getUniformLocation(prog, 'uGlowAmt'), S.glow ? 1.0 : 0.0);
    gl.uniform3f(gl.getUniformLocation(prog, 'uBg'), BG[0] / 255, BG[1] / 255, BG[2] / 255);
    gl.uniform3f(gl.getUniformLocation(prog, 'uBg2'), BG2[0] / 255, BG2[1] / 255, BG2[2] / 255);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else draw2D();
}

// 2d fallback when there is no webgl2
let glowCanvas = null;
function draw2D() {
  const x = ctx2d;
  const bgr = x.createLinearGradient(0, offY, 0, offY + H * cellH);
  bgr.addColorStop(0.55, 'rgb(' + BG.join(',') + ')'); bgr.addColorStop(0.95, 'rgb(' + BG2.join(',') + ')');
  x.fillStyle = bgr; x.fillRect(0, 0, canvas.width, canvas.height);
  if (S.glow) {
    if (!glowCanvas) glowCanvas = document.createElement('canvas');
    glowCanvas.width = W; glowCanvas.height = H;
    const gx = glowCanvas.getContext('2d'), img = gx.createImageData(W, H);
    for (let i = 0; i < N; i++) { img.data[i * 4] = Math.min(255, glowOut[i * 4] * 255); img.data[i * 4 + 1] = Math.min(255, glowOut[i * 4 + 1] * 255); img.data[i * 4 + 2] = Math.min(255, glowOut[i * 4 + 2] * 255); img.data[i * 4 + 3] = 255; }
    gx.putImageData(img, 0, 0);
    x.imageSmoothingEnabled = true;
    x.globalCompositeOperation = 'lighter';
    x.drawImage(glowCanvas, offX, offY, W * cellW, H * cellH);
    x.globalCompositeOperation = 'source-over';
  }
  x.font = atlas.wt + atlas.fs + 'px ' + FONT_STACK; x.textBaseline = 'alphabetic';
  for (let y = 0; y < H; y++) for (let c = 0; c < W; c++) {
    const i = y * W + c;
    if (!G[i]) continue;
    x.fillStyle = 'rgb(' + C[i * 4] + ',' + C[i * 4 + 1] + ',' + C[i * 4 + 2] + ')';
    x.fillText(String.fromCharCode(32 + G[i]), offX + c * cellW, offY + y * cellH + atlas.base);
  }
}

// timing and keys
let simT = 0, last = 0, due = 0, raf = 0, fpsShown = 0, fpsCount = 0, fpsSince = 0;
function renderAt(t) { compose(t); present(); }
function tick(now) {
  raf = requestAnimationFrame(tick);
  // average 1/fps so 25fps stays 25 on a 60hz screen
  const gap = 1000 / S.fps;
  if (due && now < due - 2) return;
  due = due && now - due < gap ? due + gap : now + gap;
  const dt = last ? Math.min(0.25, (now - last) / 1000) : 0;
  last = now;
  fpsCount++;
  if (!fpsSince) fpsSince = now;
  else if (now - fpsSince >= 1000) { fpsShown = Math.round(fpsCount * 1000 / (now - fpsSince)); fpsCount = 0; fpsSince = now; }
  simT = (simT + dt * S.speed) % scene.T;
  renderAt(simT);
}
function start() { if (!raf && !CAPTURE) { last = 0; due = 0; fpsSince = 0; fpsCount = 0; raf = requestAnimationFrame(tick); } }
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

function setWind(v) {
  const was = windAcc(simT);
  S.wind = clamp(Math.round(v * 10) / 10, -6, 6);
  windOffset += was - windAcc(simT);
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  let refire = false;
  switch (k) {
    case 'h': case 'H': case '?': showHelp = !showHelp; break;
    case ']': case '+': case '=': S.speed = clamp(S.speed + 0.25, 0.25, 4); break;
    case '[': case '-': case '_': S.speed = clamp(S.speed - 0.25, 0.25, 4); break;
    case 'w': setWind(S.wind - 0.4); refire = true; break;
    case 'W': setWind(S.wind + 0.4); refire = true; break;
    case 's': S.snow = clamp(Math.round((S.snow - 0.2) * 10) / 10, 0, 4); break;
    case 'S': S.snow = clamp(Math.round((S.snow + 0.2) * 10) / 10, 0, 4); break;
    case 'f': S.fire = clamp(Math.round((S.fire - 0.2) * 10) / 10, 0.4, 3); refire = true; break;
    case 'F': S.fire = clamp(Math.round((S.fire + 0.2) * 10) / 10, 0.4, 3); refire = true; break;
    case 'l': S.flies = clamp(Math.round((S.flies - 0.4) * 10) / 10, 0, 6); break;
    case 'L': S.flies = clamp(Math.round((S.flies + 0.4) * 10) / 10, 0, 6); break;
    case 'g': case 'G': S.glow = !S.glow; break;
    case 'm': case 'M': S.moon = !S.moon; break;
    case 'b': case 'B': S.bar = !S.bar; break;
    case 'Escape': showHelp = false; break;
    default: return;
  }
  if (refire) buildFire();
  e.preventDefault();
  if (!raf) renderAt(simT);
});

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { layout(); renderAt(simT); }, 150);
});

async function boot() {
  try {
    for (const [data, weight] of [[FONT_WOFF2, '400'], [FONT_WOFF2_BOLD, '700']]) {
      const face = new FontFace('WNMono', 'url(data:font/woff2;base64,' + data + ')', { weight });
      await face.load();
      document.fonts.add(face);
    }
  } catch (err) {}
  try { gl = initGL(); } catch (err) { gl = null; }
  if (!gl) ctx2d = canvas.getContext('2d');
  layout();
  renderAt(simT);
  start();
}
boot();
})();
